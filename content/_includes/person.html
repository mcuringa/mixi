<div class="col-md-6 p-3">
    <div class="row align-items-center">
        <div class="col-4">
            <img src="/assets/images/people/{{person.key}}.png" class="img-fluid" alt="{{person.name}}">
        </div>
        <div class="col-8">
            <p>
                <strong>{{person.name}}</strong><br>
                {{person.title}}<br>
                {{person.dept}}
            </p>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-12">
            <p>{{person.bio}}</p>
        </div>
    </div>
</div>
