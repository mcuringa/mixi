
- title: "Learning Under Algorithmic Conditions"
  desc: >
    This new book presents 28 <i>memoranda</i> from leading scholars, 
    offering concise commentary on a range of topics 
    that connect shared interests in understanding how learning under
    algorithmic conditions is newly embodied, more-than-human, 
    political, and all too compliant with speculative capital and techno-economic proceduralism.
  link: "/research/luac"
  img: "/assets/images/control-soc.png"
  alt: "abstract painting with person emerging from dark colors"

- title: "Maps That Matter: CS+Spatial Justice"
  desc: >
    Combining computer science, spatial justice, and critical geographies, we explore ways to teach CS
    that expand who studies computing, and how new approaches may transform computing and engineering fields.
    <b>Funded by the Mozilla Foundation.</b>
  link: "/research/maps-that-matter"
  img: "/assets/images/nyc-dots-thumb.png"
  alt: "dot density map of racial demographics in NYC"

- title: "School Maps & Sensory Ethnography"
  desc: > 
    Mapping schools to better understand the spatial environment where learning occurs,
    using sensor ethnography, experimental cartography, and participatory design.
    <b>Funded by the Spencer Foundation.</b>
  link: "#"
  img: "/assets/images/d13-thumb.png"
  alt: "map of schools in district 13 brooklyn"

