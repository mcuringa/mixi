- title: "Asynchronous online voice discussions"
  subtitle: "A look at the unique modalities of asynchronous audio"
  id: "VT"
  desc: > 
      This ongoing study examines asynchronous voice discussions in 
      online courses using VoiceThread, a platform for voice, text, 
      and video communication. While most research focuses on text-based 
      messaging or video conferencing, this study investigates 
      voice-based discussion forums. Adapting methods from Zhu, 
      Herring, and Bonk (2019), it analyzes speech acts and linguistic 
      patterns through CMC speech acts analysis and Linguistic Inquiry 
      and Word Count (LIWC). The study tracks three students’ 
      participation over a semester, exploring how varying levels of 
      engagement influence communication styles.
  researchers: "Aaron Hung"
  link: "#"
  img: "/assets/images/mosaic.jpg"
  alt: "multicolored mosaic tiles"

- title: "Translanguaging, GenAI, and LLM"
  subtitle: "Speaking 2 languages with chat-gpt"
  id: "LLM"
  desc: > 
    This project explores the ways that Chat-GPT (and other LLM) can
    use multiple languages in the same conversation to communicate ideas
    more clearly. Based on understandings of translanguaging and raciolinguistics,
    researchers prompt LLM to use Spanish and English, or Chinese and English over
    the course of a conversation. They analyze conversation in various contexts:
    casual (e.g. cooking), school academics (e.g. NYS regents), general knowledge
    (e.g. _who's the actor in Attack the Block?_). They compare the LLM's method
    of translanguaging to the documented approaches used by human speakers, examining
    the syntax, morphology, lexical structures, and content of the conversations.
  link: "#"
  researchers: Aarong Hung, Matt Curinga
  img: "/assets/images/leaf-bg.jpg"
  alt: "colorful leaf"