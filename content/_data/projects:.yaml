- title: "Learning Under Algorithmic Conditions"
  subtitle: "A new book by MIXI faculty"
  id: "LUAC"
  desc: >
        This new book presents 28 _memoranda_ from leading scholars, 
        offering concise commentary on a range of topics 
        that connect shared interests in understanding how learning under
        algorithmic conditions is newly embodied, more-than-human, 
        political, and all too compliant with speculative capital and techno-economic proceduralism.\

        The manuscript will be published in Spring 2025 by the University of Minnesota Press.
  link: "/research/luac"
  researchers: Liz de Freitas, Matt Curinga
  img: "/assets/images/luac-dalle.png"
  alt: "abstract painting with person emerging from dark colors"

- title: "Maps That Matter: CS+Spatial Justice"
  subtitle: "Rethinking college level CS"
  id: "RCC"
  desc: >
    Combining computer science, spatial justice, and critical geographies, we explore ways to teach CS
    that expand who studies computing, and how new approaches may transform computing and engineering fields.
    This project studies new course designs to for undergraduate and graduate computing, as well
    as the creation of new software tools to facilitate teaching spatial justice and critical
    cartography alongside computer programming with Python.\

    **Funded by the Mozilla Foundation.**
  link: "/research/maps-that-matter"
  researchers: Matt Curinga, Suraj Uttamchandani
  img: "/assets/images/nyc-dots.png"
  alt: "dot density map of racial demographics in NYC"

- title: "School Maps & Sensory Ethnography"
  subtitle: "exploring the spaces and places of learning with new technologies"
  id: "SchoolMaps"
  desc: > 
    We are mapping schools to better understand the spatial environment where learning occurs,
    using sensory ethnography, experimental cartography, and participatory design.
    Researchers combine ethnographic investigations of schools and their
    communities, with historical and current geospatial data to gather the
    context of learning in school sites. This knowledge is combined through
    collaborative research with high school and middle school students,
    using 3D environments and sensors to investigate the material and affective
    aspects of their schools.\

    **Funded by the Spencer Foundation.**
  link: "#"
  researchers: Liz de Freitas, Matt Curinga
  img: "/assets/images/unity-schools.png"
  alt: "school sim in Unity"

- title: "Collaborative Learning in Ensembles"
  id: Choir
  subtitle: Social bonding & intimacy in the choir
  desc: > 
    This work is motivated by a desire to understand if and how 
    pedagogues can create intimacy and social bonding through deliberate, 
    disciplinary (rather than content-free) pedagogical routines. 
    Learning scientists have demonstrated that designing learning 
    environments to support strong positive relationships can result 
    in deep disciplinary learning. Choral education scholars repeatedly 
    call attention to how positive relationships are a common outcome of 
    participation in choir. However, scholars have rarely brought these two 
    fields of study into conversation to understand how the learning of 
    relational orientations takes place at individual, sectional, and 
    choir-wide levels, how it intersects with the making of music and 
    learning of musical concepts, and how teachers’ pedagogical choices 
    support this learning. This study is based on an ethnography I 
    conducted with a college-level choir over the course of a semester, 
    and included field notes, video- and audio-records of each rehearsal 
    and performance, and interviews with students and the conductor.
  link: "#"
  researchers: Suraj Uttamchandani
  img: "/assets/images/choir.png"
  alt: "Diagramatic representation of ensemble learning in a choir"

- title: "Decolonizing education in the Americas"
  subtitle: "Archival research of early colonial mathematics"
  id: "Decolonizing"
  desc: > 
    This is an international research project with historians and educators, 
    including colleagues in Mexico and Canada, exploring 17th century archives in Puebla, Mexico.
    The project traces the spread of mathematical knowledge, along with colonial bias,
    as it spread from Spain to Mexico, and aroud the globe.\

    **Funded by the Social Sciences and Humanities Research Council of Canada.**
  link: "#"
  researchers: Liz de Freitas
  img: "/assets/images/steganographia.jpg"
  alt: "16th century illustration of measuring angles from a tower"

- title: "STEAM, Creativity, and Teacher Preparation"
  subtitle: Transforming schools with arts and innovation
  id: STEAM
  desc: > 
    Preparing teachers to integrate art, aesthetics, and creativity into school
    STEM education through hands-on lab work, and school-based apprenticeships.
    Studying how new approaches might lead to institutional change, in close
    partnership with New York City public schools.\

    **Funded by the National Science Foundation and State University of New York (SUNY).**
  link: "#"
  researchers: Tracy Hogan, Matt Curinga, Liz de Freitas
  img: "/assets/images/bubbles.jpg"
  alt: "Student teachers modifying a bubble machine with tools and soldering iron"

