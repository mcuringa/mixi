- title: "Decolonizing education in the Americas "
  desc: > 
    This is an international research project with historians and educators, 
    including colleagues in Mexico and Canada, exploring 17th century archives in Puebla, Mexico.
    <b>Funded by the Social Sciences and Humanities Research Council of Canada.</b>
    
  link: "#"
  img: "/assets/images/math-text.png"
  alt: "16th century illustration of measuring angles from a tower"

- title: "STEAM, Creativity, and Teacher Preparation"
  desc: > 
    Preparing teachers to integraate art, aesthetics, and creativity into school
    STEM education through hands-on lab work, and school-based apprenticeships.
    Studying how new approaches might lead to institutional change, in close
    partnership with New York City public schools.
    <b>Funded by the National Science Foundation and State University of New York (SUNY).</b>
  link: "#"
  img: "/assets/images/bubbles.jpg"
  alt: "Student teachers modifying a bubble machine with tools and soldering iron"

